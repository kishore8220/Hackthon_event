<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Resume Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        .chat-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .chat-box {
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f5f5f5;
            margin-bottom: 10px;
        }

        .chat-message {
            margin: 10px 0;
            padding: 10px;
            background-color: #e0f7fa;
            border-radius: 10px;
            max-width: 80%;
        }

        .chat-message.user {
            background-color: #b2dfdb;
            margin-left: auto;
        }

        .chat-message.bot {
            background-color: #ffffff;
            margin-right: auto;
        }

        .input-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }

        .input-box input[type="file"] {
            display: none;
        }

        .input-box button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .input-box button:hover {
            background-color: #45a049;
        }

        .input-box label {
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            display: inline-block;
        }

        .result {
            margin-top: 20px;
            padding: 10px;
            background-color: #e7f7e7;
            border: 1px solid #d2f0d2;
            border-radius: 4px;
            display: none;
        }

        .error {
            color: red;
            display: none;
        }

    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-box" id="chatBox">
            <div class="chat-message bot">
                <p>Hi there! Please upload your resume.</p>
            </div>
        </div>

        <div class="input-box">
            <label for="fileInput">Send Resume</label>
            <input type="file" id="fileInput" name="file" accept=".pdf, .docx" required>
            <button id="uploadButton">Send</button>
        </div>

        <div id="error" class="error"></div>
        <div id="result" class="result">
            <p><strong>File Name:</strong> <span id="fileName"></span></p>
            <p><strong>Score:</strong> <span id="score"></span></p>
            <p><strong>Feedback:</strong></p>
            <ul id="feedbackList"></ul>
            <p><strong>Resume Content:</strong></p>
            <pre id="resumeContent"></pre>
            <a id="downloadLink" href="#" target="_blank">Download Resume</a>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const fileInput = document.getElementById('fileInput');
        const uploadButton = document.getElementById('uploadButton');
        const resultDiv = document.getElementById('result');
        const errorDiv = document.getElementById('error');
        const fileNameSpan = document.getElementById('fileName');
        const scoreSpan = document.getElementById('score');
        const feedbackList = document.getElementById('feedbackList');
        const resumeContent = document.getElementById('resumeContent');
        const downloadLink = document.getElementById('downloadLink');

        uploadButton.addEventListener('click', async function() {
            const file = fileInput.files[0];
            if (!file) {
                showError("Please select a file to upload.");
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            try {
                const response = await fetch('/', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.error) {
                    showError(data.error);
                } else {
                    showSuccess(data);
                }
            } catch (error) {
                showError("Something went wrong. Please try again.");
            }
        });

        function showError(message) {
            const errorMessage = document.createElement('div');
            errorMessage.classList.add('chat-message', 'error');
            errorMessage.innerHTML = `<p>Error: ${message}</p>`;
            chatBox.appendChild(errorMessage);
            scrollToBottom();
        }

        function showSuccess(data) {
            const successMessage = document.createElement('div');
            successMessage.classList.add('chat-message', 'bot');
            successMessage.innerHTML = `<p>File uploaded successfully!</p>`;
            chatBox.appendChild(successMessage);

            resultDiv.style.display = 'block';
            fileNameSpan.textContent = data.filename;
            scoreSpan.textContent = data.score;
            resumeContent.textContent = data.resume_content;
            downloadLink.href = data.file_url;
            downloadLink.textContent = "Download Resume";

            feedbackList.innerHTML = '';
            data.feedback.forEach(feedback => {
                const listItem = document.createElement('li');
                listItem.textContent = feedback;
                feedbackList.appendChild(listItem);
            });

            scrollToBottom();
        }

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

    </script>

</body>
</html>
